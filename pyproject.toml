[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smilesbrain"
version = "0.1.0"
description = "Predict whole-brain neurotransmitter action maps of molecules from SMILES."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jai Choraria" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Heavy/ML extras kept separate so CI and the smoke test stay light.
chem = ["rdkit>=2023.9"]
torch = ["torch>=2.1"]
viz = ["matplotlib>=3.7", "nibabel>=5.1"]
# Observed-map ingestion (nilearn) and spin nulls (netneurotools 0.3 dropped gen_spinsamples).
neuro = ["nilearn>=0.10", "nibabel>=5.1", "netneurotools>=0.2.5,<0.3"]
dev = ["pytest>=7.4", "ruff>=0.1"]
all = ["rdkit>=2023.9", "torch>=2.1", "matplotlib>=3.7", "nibabel>=5.1", "nilearn>=0.10", "netneurotools>=0.2.5,<0.3", "pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
